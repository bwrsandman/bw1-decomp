# SafeDisc key material, used by the pre-split decrypt step
# (tools/decrypt_safedisc.py) to unwrap orig/BW1W120/runblack.exe into
# the `object` above. Stripped from dtk's copy of this file, which is generated
# into build/BW1W120/config.yml -- dtk has no field for it and never needs one.
#
# These keys are useless without your own copy of that executable, whose SHA-1 is
# pinned below: decrypting one build with another build's keys does not fail
# loudly, it produces a plausible-looking file full of noise, so the pin is
# enforced rather than advisory.
#
# The entry point is NOT key material and is not stored here -- it is read from
# symbols.txt (_WinMainCRTStartup) above. See docs/transformations.md.
#
# 2.60 uses an AES-driven CFB-8 stream cipher re-keyed twice per section, so each
# encrypted section needs three session keys (32/24/16 bytes, one per keystream
# generator) plus one 16-byte keystream register shared by both. The stolen-import
# key is not listed because it IS .data's generator-C key, and is derived.
#
# Provenance: Safedisc2Cleaner project, BW1E120/README.md and BW1E120/DECRYPTING.md.
safedisc:
  profile: sd260           # SafeDisc 2.60.052 -- AES CFB-8, encrypted import table
  expect_sha1: c9bba68e17f5ec162ff235a496779f43090508db
  keys:
    iv: 82828282c9c9c9c97d7d7d7dfafafafa
    sections:
